# Nginx конфигурация для api.vyborsto.ru (API эндпоинты)

# HTTP -> HTTPS редирект
server {
    listen 80;
    listen [::]:80;
    server_name api.vyborsto.ru;

    # Для получения SSL сертификата Let's Encrypt
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$server_name$request_uri;
    }
}

# HTTPS конфигурация
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.vyborsto.ru;

    # SSL сертификаты (будут созданы через certbot)
    ssl_certificate /etc/letsencrypt/live/api.vyborsto.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.vyborsto.ru/privkey.pem;

    # SSL параметры (рекомендации Mozilla)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_stapling on;
    ssl_stapling_verify on;

    # Security headers для API
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;

    # CORS headers (настройте под ваши нужды)
    add_header Access-Control-Allow-Origin "https://vyborsto.ru" always;
    add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Requested-With" always;
    add_header Access-Control-Allow-Credentials "true" always;
    add_header Access-Control-Max-Age "3600" always;

    # Логи
    access_log /var/log/nginx/api.vyborsto.ru.access.log;
    error_log /var/log/nginx/api.vyborsto.ru.error.log;

    # Увеличенные таймауты для API
    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;

    # Максимальный размер тела запроса (для загрузки файлов)
    client_max_body_size 10M;

    # OPTIONS метод для CORS preflight
    if ($request_method = 'OPTIONS') {
        add_header Access-Control-Allow-Origin "https://vyborsto.ru" always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Requested-With" always;
        add_header Access-Control-Allow-Credentials "true" always;
        add_header Access-Control-Max-Age "3600" always;
        add_header Content-Length 0;
        add_header Content-Type text/plain;
        return 204;
    }

    # Проксирование всех запросов на /api роуты Next.js
    location / {
        # Добавляем /api prefix к пути
        rewrite ^/(.*)$ /api/$1 break;

        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;

        # Заголовки
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        proxy_cache_bypass $http_upgrade;
        proxy_redirect off;

        # Отключаем кэширование для API запросов
        proxy_no_cache 1;
        proxy_cache_bypass 1;
    }

    # Health check endpoint (без rewrite)
    location /health {
        proxy_pass http://localhost:3000/api/health;
        access_log off;
    }

    # Документация API (опционально)
    location /docs {
        proxy_pass http://localhost:3000/api/docs;
    }
}
